name: "Java CI"
on:
  push:
    branches:
      - '[4-9]+.[0-9]+.x'
  pull_request:
    branches:
      - '[4-9]+.[0-9]+.x'
  workflow_dispatch:
jobs:
  test_project:
    name: "Test Project"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        java: [17, 21]
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: liberica
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      - name: "🏃 Run tests"
        run: ./gradlew check
  publish_snapshot:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: "Build Project and Publish Snapshot release"
    needs: test_project
    runs-on: ubuntu-24.04
    permissions:
      contents: write # updates gh-pages branch
      packages: write # publishes snapshot to GitHub Packages
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: liberica
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      - name: "🔨 Build Project"
        run: ./gradlew build
      - name: "📤 Publish Snapshot version to Artifactory (repo.grails.org)"
        env:
          GRAILS_PUBLISH_RELEASE: 'false'
          MAVEN_PUBLISH_USERNAME: ${{ secrets.MAVEN_PUBLISH_USERNAME }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
          MAVEN_PUBLISH_URL: ${{ secrets.MAVEN_PUBLISH_SNAPSHOT_URL }}
        run: ./gradlew publish
      - name: "📖 Generate Snapshot Documentation"
        if: ${{ hashFiles('src/main/asciidoc/**') != '' }}
        run: ./gradlew docs
      - name: "📤 Publish Snapshot Documentation to Github Pages"
        if: ${{ hashFiles('src/main/asciidoc/**') != '' }}
        uses: apache/grails-github-actions/deploy-github-pages@asf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADLE_PUBLISH_RELEASE: 'false'
          SOURCE_FOLDER: build/docs
  documenation:
    runs-on: ubuntu-latest
    needs: [ get-version, release ]
    env:
      GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
      GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
      RELEASE_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
      - uses: micronaut-projects/github-actions/export-gradle-properties@master
        id: asciidoctor
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build documentation
        run: ./gradlew -Pversion="${{ env.RELEASE_VERSION }}" asciidoctor
      - uses: micronaut-projects/github-pages-deploy-action@master
        if: success()
        env:
          BETA: false
          TARGET_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/asciidoc
          DOC_FOLDER: latest
          COMMIT_EMAIL: ${{ vars.GIT_USER_EMAIL }}
          COMMIT_NAME: ${{ vars.GIT_USER_NAME }}
          VERSION: ${{ env.RELEASE_VERSION }}
      - uses: micronaut-projects/github-actions/post-release@master
        if: success()
        with:
          token: ${{ secrets.GH_TOKEN }}
